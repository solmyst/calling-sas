name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check static/app.js && node --check static/forms.js && node --check static/views.js
      - run: node --check static/voice-session.js && node --test tests/voice-session.test.mjs
      - run: node --test video/scripts/motion.test.mjs
